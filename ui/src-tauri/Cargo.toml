[package]
name = "narrative-universe-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[dependencies]
narrative-universe = { path = "../.." }
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
uuid = { version = "=1.28.0", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
tempfile = "=3.27.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "=1.0.154"
